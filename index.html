<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Travio - Your intelligent travel companion. Plan, optimize and enjoy every kilometer.">
    <meta name="theme-color" content="#10b981">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travio">
    <title>Travio - Your Trip Mate</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Design Tokens ── */
:root{
    --bg:#ECFDF5;
    --surface:#fff;
    --dark:#1A1A1A;
    --primary:#10B981;
    --primary-dark:#059669;
    --primary-darker:#047857;
    --primary-light:rgba(16,185,129,0.08);
    --primary-gradient:linear-gradient(135deg,#059669,#0D9488);
    --border:#d0d0d0;
    --border-light:#e8e8e8;
    --label:#5a5a5a;
    --mid:#777;
    --radius:6px;
    --shadow:0 1px 4px rgba(0,0,0,0.08);
    --shadow-md:0 2px 8px rgba(0,0,0,0.12);
    --red:#EF4444;
    --red-light:rgba(239,68,68,0.08);
    --green:#006633;
    --green-light:#e6f5ec;
    --yellow:#F59E0B;
    --yellow-light:#fef3c7;
}

/* ── Typography ── */
body{
    font-family:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg);
    color:var(--dark);
    line-height:1.5;
    min-height:100vh;
    -webkit-overflow-scrolling:touch;
}
.mono{font-family:'Space Mono',monospace;font-size:.85em}
input,select,textarea{font-size:16px!important}

/* ── Buttons ── */
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 24px;border:none;border-radius:var(--radius);
    font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
    cursor:pointer;transition:all .15s;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-outline{background:var(--surface);color:var(--dark);border:1.5px solid var(--border)}
.btn-outline:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--dark);border:1px solid transparent}
.btn-ghost:hover{background:rgba(0,0,0,.05)}
.btn-ghost-white{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-ghost-white:hover{background:rgba(255,255,255,.1)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-lg{padding:14px 32px;font-size:16px;border-radius:8px}
.btn-full{width:100%}

/* ── Forms ── */
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.form-group label{font-size:12px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{
    padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);
    font-family:'DM Sans',sans-serif;transition:border .15s;background:var(--surface);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary)}
/* ── Country scope (optional): chips + one add row ── */
.scope-row{display:flex;gap:8px;align-items:stretch}
.scope-row input{flex:1;min-width:0}
.scope-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.scope-chips:empty{display:none}
.scope-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-light);
    color:var(--green);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600;
}
.scope-chip button{
    border:none;background:transparent;color:inherit;cursor:pointer;
    font-size:15px;line-height:1;padding:0 4px;border-radius:999px;
}
.scope-chip button:hover{background:rgba(0,0,0,.08)}
.scope-state{font-size:12px;color:var(--mid);margin-top:6px}
.scope-msg{font-size:13px;margin-top:6px;display:none}
.scope-msg.err{color:var(--red)}
.form-msg{font-size:13px;padding:8px 12px;border-radius:var(--radius);display:none;margin-top:8px}
.form-msg.ok{background:var(--green-light);color:var(--green)}
.form-msg.err{background:var(--red-light);color:var(--red)}

/* ── Cards ── */
.card{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:20px}
.card-header{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* ── Header Bar ── */
.app-header{
    background:var(--primary-gradient);color:#fff;
    padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:100;
}
.app-header-left{display:flex;align-items:center;gap:12px}
.app-header-logo{font-size:24px}
.app-header-title{font-size:18px;font-weight:700}
.app-header-right{display:flex;align-items:center;gap:8px}
.app-header-user{font-size:13px;opacity:.85}

/* ── Language Selector ── */
.lang-select{
    background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);
    padding:6px 10px;border-radius:var(--radius);font-size:13px;font-family:'DM Sans',sans-serif;
    cursor:pointer;
}
.lang-select option{color:var(--dark);background:var(--surface)}
.lang-select-login{
    background:var(--surface);color:var(--dark);border:1px solid var(--border);
    padding:8px 12px;border-radius:var(--radius);font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;
}

/* ── Login View ── */
.login-container{
    max-width:380px;margin:60px auto;padding:0 20px;text-align:center;
}
.login-logo{font-size:56px;margin-bottom:8px}
.login-title{font-size:28px;font-weight:700;color:var(--primary-dark)}
.login-tagline{color:var(--mid);font-size:14px;margin-bottom:32px}
.login-card{background:var(--surface);border-radius:10px;box-shadow:var(--shadow-md);padding:28px}
.login-error{background:var(--red-light);color:var(--red);padding:8px 12px;border-radius:var(--radius);font-size:13px;margin-top:12px;display:none}
.login-lang-bar{margin-top:20px}

/* ── Main Layout ── */
.main-content{padding:16px;max-width:1200px;margin:0 auto}
.two-col{display:grid;grid-template-columns:1fr 1.6fr;gap:16px}
@media(max-width:768px){.two-col{grid-template-columns:1fr}}

/* ── Route Form ── */
.advanced-toggle{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;
    padding:8px 0;border:none;background:none;width:100%;font-family:'DM Sans',sans-serif;
}
.advanced-toggle:hover{color:var(--primary-dark)}
.budget-day-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.budget-day-input{width:80px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px}

/* ── Result Area ── */
.result-empty{text-align:center;padding:48px 20px;color:var(--mid)}
.result-empty-icon{font-size:48px;margin-bottom:12px}
.result-loading{text-align:center;padding:48px 20px}
.loading-spinner{
    border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;
    width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 16px;
}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.result-header{
    background:var(--primary-light);border-left:4px solid var(--primary);
    padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:16px;
}
.result-meta{font-size:12px;color:var(--label)}
.result-body{white-space:pre-wrap;font-size:14px;line-height:1.7;color:var(--dark)}
.result-error{background:var(--red-light);color:var(--red);padding:12px;border-radius:var(--radius);display:none}

/* ── Progress ── */
.progress-step{font-weight:600;color:var(--dark);font-size:14px}
.progress-track{height:6px;background:var(--border-light);border-radius:3px;overflow:hidden;margin:12px auto 8px;max-width:320px}
.progress-bar{height:100%;width:0;background:var(--primary);transition:width .25s ease}
.progress-detail{font-size:12px;color:var(--label);min-height:16px;word-break:break-word}
.progress-note{font-size:11px;color:var(--mid);margin-top:10px;max-width:340px;margin-left:auto;margin-right:auto}

/* ── Itinerary ── */
.notice-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.notice{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius);font-size:13px;line-height:1.45}
.notice-info{background:var(--primary-light);color:var(--primary-darker)}
.notice-warn{background:var(--yellow-light);color:#8a5a00}
/* Highest severity: "the numbers below are not real". Never a whisper. */
.notice-alert{background:var(--red-light);color:var(--red);border:1px solid rgba(239,68,68,.45);font-weight:600}
.notice-icon{flex:0 0 auto}
.notice-text{flex:1 1 auto}

/* ── Where each place actually landed ──
   The element that would have caught "Santillana de Mar" resolving to Mexico. It
   sits ABOVE the summary card on purpose: the labels have to be readable before the
   kilometres are believed. Badges carry words, never colour alone. */
.geo-panel{background:var(--surface);border:1px solid var(--border-light);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.geo-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label);margin-bottom:8px}
.geo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.geo-item{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:13px;line-height:1.5}
.geo-item-outlier{background:var(--red-light);border:1px solid rgba(239,68,68,.45);border-radius:var(--radius);padding:5px 8px}
.geo-name{font-weight:700;color:var(--dark)}
.geo-arrow{color:var(--mid)}
.geo-label{color:var(--label);word-break:break-word}
.geo-missing{color:#8a5a00;font-style:italic}
.geo-badge{font-size:10px;font-weight:600;padding:1px 8px;border-radius:10px;line-height:1.7}
.geo-badge-outlier{background:var(--red);color:#fff}
.geo-badge-moved{background:var(--yellow-light);color:#8a5a00}
.geo-badge-matches{background:var(--primary-light);color:var(--primary-darker)}
.geo-note{font-size:11px;color:var(--mid);margin-top:8px;line-height:1.5}

.summary-card{background:var(--green-light);border:1px solid rgba(16,185,129,.35);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.summary-card.summary-over{background:var(--red-light);border-color:rgba(239,68,68,.35)}
/* Not green: a card whose numbers are unusable, or whose total is only a floor. */
.summary-card.summary-unreliable{background:var(--red-light);border-color:rgba(239,68,68,.45)}
.summary-card.summary-unknown{background:var(--yellow-light);border-color:rgba(217,164,6,.35)}
/* The arithmetic is sound; the PREMISE is in doubt. Not green, not red — and the
   words that say why are in the alert above it, never in this colour alone. */
.summary-card.summary-geo-outlier{background:var(--yellow-light);border-color:rgba(217,164,6,.45)}
.summary-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label);margin-bottom:10px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
.summary-cell{display:flex;flex-direction:column;gap:2px}
.summary-value{font-size:16px;font-weight:700;color:var(--dark)}
.summary-label{font-size:11px;color:var(--label);text-transform:uppercase;letter-spacing:.3px}
.summary-flag{margin-top:10px;font-size:13px;font-weight:600}
.summary-source{margin-top:6px;font-size:11px;color:var(--mid)}
.flag-ok{color:var(--green)}
.flag-over{color:var(--red)}
/* Neither ok nor over: the verdict cannot be given at all. */
.flag-unknown{color:#8a5a00}

.day-list{display:flex;flex-direction:column;gap:12px}
.day-card{background:var(--surface);border:1px solid var(--border-light);border-left:4px solid var(--primary);border-radius:var(--radius);padding:14px 16px}
.day-card.day-over{border-left-color:var(--red)}
.day-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.day-num{background:var(--primary);color:#fff;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}
.day-route{font-weight:700;font-size:15px}
.day-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.badge-warn{background:var(--yellow-light);color:#8a5a00}
.badge-rest{background:var(--primary-light);color:var(--primary-darker)}
.day-stats{display:flex;flex-wrap:wrap;gap:18px;padding:8px 0 10px;border-bottom:1px dashed var(--border-light);margin-bottom:10px}
.stat{display:flex;flex-direction:column}
.stat-value{font-size:14px;font-weight:700;color:var(--dark)}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--label)}
.leg-list{list-style:none;margin:0 0 10px;padding:0}
.leg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:6px 0 6px 14px;position:relative;font-size:13px;border-bottom:1px solid var(--border-light)}
.leg:last-child{border-bottom:none}
.leg::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.leg-name{font-weight:600}
.leg-meta{color:var(--label);font-size:12px}
.day-overnight{font-size:12px;color:var(--primary-darker);margin-bottom:10px}
.day-rest-text{font-size:13px;color:var(--label);margin-bottom:10px}

.day-enrich{background:var(--bg);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.enrich-group{margin-bottom:8px}
.enrich-group:last-child{margin-bottom:0}
.enrich-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--primary-darker);margin-bottom:4px}
.enrich-list{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.enrich-text{font-size:13px;line-height:1.55}
.enrich-tip{display:flex;gap:8px;font-size:13px;line-height:1.5;background:var(--yellow-light);border-radius:var(--radius);padding:8px 10px;margin-top:8px}
.enrich-status{background:var(--primary-light);color:var(--primary-darker);font-size:12px;padding:6px 10px;border-radius:var(--radius);margin-bottom:12px}

/* ── Route map ──
   No fixed pixel height anywhere: the SVG carries a viewBox and scales to the
   width the card gives it, so the card grows with the page instead of cropping. */
.map-panel{background:var(--surface);border:1px solid var(--border-light);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.map-panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:8px}
.map-panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label)}
.map-source{font-size:11px;color:var(--mid);text-align:right}
/* An estimate never wears the calm colour: same rule as the notice list. */
.map-source-estimate{color:#8a5a00;font-weight:600}
.map-figure svg{width:100%;height:auto;display:block;border-radius:var(--radius)}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.map-legend-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--label)}
.map-legend-swatch{width:16px;flex:0 0 auto;border-radius:2px}

/* ── Export ── */
.export-bar{margin-top:16px;padding-top:12px;border-top:1px solid var(--border-light)}
.export-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label);margin-bottom:8px}
.export-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.export-date{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.3px}
.export-date input{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:'Space Mono',monospace;background:var(--surface)}
.export-hint{font-size:11px;color:var(--mid);margin-top:8px}

.day-cost{border-top:1px dashed var(--border-light);padding-top:8px}
.cost-table{width:100%;border-collapse:collapse;font-size:13px}
.cost-table td{padding:3px 0}
.cost-table td:last-child{text-align:right}
.cost-table .cost-total td{font-weight:700;border-top:1px solid var(--border-light);padding-top:6px}
.cost-table .cost-budget td{color:var(--label)}
.est-flag{font-size:10px;color:var(--mid)}
.cost-table .cost-unknown td{color:#8a5a00}
.cost-flag{margin-top:6px;font-size:12px;font-weight:600;text-align:right}
.rates-note{margin-top:12px;font-size:11px;color:var(--mid);text-align:center}

/* ── Cost assumptions (advanced panel) ── */
.cost-assumptions{border-top:1px solid var(--border-light);margin-top:8px;padding-top:10px}
.cost-assumptions-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label);margin-bottom:8px}
.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

/* ── Saved Routes ── */
.route-card{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--surface);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:8px;
}
.route-card-info strong{font-size:14px}
.route-card-meta{font-size:11px;color:var(--mid);display:block;margin-top:2px}
.route-card-actions{display:flex;gap:6px}

/* ── Admin ── */
.admin-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.admin-table th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--label);background:var(--bg);border-bottom:1px solid var(--border-light)}
.admin-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border-light)}
.admin-table tr:hover{background:rgba(0,0,0,.015)}
.actions-cell{display:flex;gap:6px}
.role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.role-admin{background:var(--primary-light);color:var(--primary-dark)}
.role-user{background:var(--green-light);color:var(--green)}

/* ── Modal ── */
.modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.4);display:none;z-index:200;
    justify-content:center;align-items:center;padding:20px;
}
.modal-overlay[style*="display: flex"],.modal-overlay[style*="display:flex"]{display:flex!important}
.modal-box{background:var(--surface);border-radius:10px;box-shadow:var(--shadow-md);padding:24px;width:100%;max-width:420px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}

/* ── Footer ── */
.app-footer{text-align:center;padding:24px;font-size:12px;color:var(--mid)}

/* ── Empty text ── */
.empty-text{text-align:center;color:var(--mid);padding:24px;font-size:14px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--mid)}

/* ── Responsive ── */
@media(max-width:480px){
    .app-header{padding:12px 14px}
    .app-header-title{font-size:16px}
    .main-content{padding:10px}
    .card{padding:14px}
    .btn-lg{padding:12px 24px;font-size:14px}
}
    </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     LOGIN VIEW
     ═══════════════════════════════════════ -->
<div id="loginView">
    <div class="login-container">
        <div class="login-logo">&#x1F5FA;&#xFE0F;</div>
        <div class="login-title" data-i18n="app.name">Travio</div>
        <div class="login-tagline" data-i18n="app.tagline">Tu companero de viaje</div>

        <div class="login-card">
            <div class="form-group">
                <label data-i18n="login.email">Email</label>
                <input type="email" id="loginEmail" data-i18n="login.email" autocomplete="email">
            </div>
            <div class="form-group">
                <label data-i18n="login.password">Password</label>
                <input type="password" id="loginPassword" data-i18n="login.password" autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-full btn-lg" id="loginBtn" onclick="doLogin()" data-i18n="login.signIn">Sign In</button>
            <div class="login-error" id="loginError"></div>
        </div>

        <div class="login-lang-bar">
            <select id="langSelectLogin" class="lang-select-login" onchange="setLanguage(this.value)">
                <option value="es">Espanol</option>
                <option value="en">English</option>
                <option value="ca">Catala</option>
                <option value="fr">Francais</option>
                <option value="zh">中文</option>
            </select>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════
     USER HOME VIEW
     ═══════════════════════════════════════ -->
<div id="userHomeView" style="display:none">
    <!-- Header -->
    <div class="app-header">
        <div class="app-header-left">
            <span class="app-header-logo">&#x1F5FA;&#xFE0F;</span>
            <span class="app-header-title">Travio</span>
        </div>
        <div class="app-header-right">
            <span class="app-header-user"><span data-i18n="nav.welcome">Hello</span>, <span id="homeUserName"></span></span>
            <select id="langSelect" class="lang-select" onchange="setLanguage(this.value)">
                <option value="es">ES</option>
                <option value="en">EN</option>
                <option value="ca">CA</option>
                <option value="fr">FR</option>
                <option value="zh">ZH</option>
            </select>
            <button class="btn btn-ghost-white btn-sm" onclick="showSavedRoutes()" data-i18n="nav.savedRoutes">My Routes</button>
            <button class="btn btn-ghost-white btn-sm" id="homeAdminBtn" style="display:none" onclick="showAdminPanel()" data-i18n="nav.admin">Admin</button>
            <button class="btn btn-ghost-white btn-sm" onclick="doLogout()" data-i18n="nav.logout">Sign out</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="two-col">
            <!-- LEFT: Travel Form -->
            <div>
                <div class="card">
                    <div class="card-header">&#x2708;&#xFE0F; <span data-i18n="form.title">Travel Data</span></div>

                    <div class="form-group">
                        <label>&#x1F4CD; <span data-i18n="form.startPoint">Starting point</span> *</label>
                        <input type="text" id="rfStartPoint" data-i18n="form.startPointPh">
                    </div>

                    <div class="form-group">
                        <label>&#x1F4CD; <span data-i18n="form.endPoint">End point</span> *</label>
                        <input type="text" id="rfEndPoint" data-i18n="form.endPointPh">
                    </div>

                    <div class="form-group">
                        <label><span data-i18n="form.destinations">Destinations</span> * <small data-i18n="form.destinationsHint">(comma separated)</small></label>
                        <textarea id="rfDestinations" rows="3" data-i18n="form.destinationsPh"></textarea>
                    </div>

                    <!-- Optional country scope. EMPTY BY DEFAULT: a Barcelona -> Lyon ->
                         Brittany trip is legitimate and must stay possible. When set, it
                         is passed to the geocoder as countrycodes= — a hard filter, never
                         a fallback. See COUNTRY SCOPE in js/geo-provider.js. -->
                    <div class="form-group">
                        <label>&#x1F30D; <span data-i18n="form.countryScope">Countries on this trip</span> <small data-i18n="form.countryScopeHint">(optional)</small></label>
                        <div class="scope-row">
                            <input type="text" id="rfCountryInput" list="rfCountryOptions" autocomplete="off" data-i18n="form.countryScopePh">
                            <datalist id="rfCountryOptions"></datalist>
                            <button type="button" class="btn btn-outline btn-sm" id="rfCountryAdd" data-i18n="form.countryScopeAdd">Add</button>
                        </div>
                        <div class="scope-chips" id="rfCountryChips"></div>
                        <p class="scope-state mono" id="rfCountryState"></p>
                        <p class="scope-msg" id="rfCountryMsg"></p>
                    </div>

                    <div class="form-group">
                        <label data-i18n="form.tripType">Trip type</label>
                        <select id="rfTripType">
                            <option value="familiar" data-i18n="form.family">Family</option>
                            <option value="pareja" data-i18n="form.couple">Couple</option>
                            <option value="aventura" data-i18n="form.adventure">Adventure</option>
                            <option value="moto" data-i18n="form.motorcycle">Motorcycle</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>&#x1F4C5; <span data-i18n="form.duration">Duration (days)</span> *</label>
                        <input type="number" id="rfDuration" value="3" min="1" max="30">
                    </div>

                    <div class="form-group">
                        <label>&#x1F4B0; <span data-i18n="form.dailyBudget">Daily budget (EUR)</span> *</label>
                        <input type="number" id="rfDailyBudget" value="100" min="10" step="10">
                    </div>

                    <!-- Advanced Options -->
                    <button class="advanced-toggle" id="advancedToggle">
                        <span data-i18n="form.advancedOptions">Advanced options</span>
                        <span id="advancedIcon">&#x25BC;</span>
                    </button>
                    <div id="advancedPanel" style="display:none">
                        <div class="form-group" style="flex-direction:row;align-items:center;gap:8px">
                            <input type="checkbox" id="rfCustomBudget">
                            <label for="rfCustomBudget" style="text-transform:none;font-size:13px" data-i18n="form.customizeBudget">Customize budget per day</label>
                        </div>
                        <div id="budgetPerDayContainer"></div>

                        <div class="form-group">
                            <label data-i18n="form.tollPreference">Toll preference</label>
                            <select id="rfTolls">
                                <option value="with-tolls" data-i18n="form.withTolls">With tolls (faster)</option>
                                <option value="without-tolls" data-i18n="form.withoutTolls">Without tolls (scenic)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>&#x1F552; <span data-i18n="form.departureTime">Departure time</span></label>
                            <input type="time" id="rfDepartureTime" value="09:00">
                        </div>

                        <div class="cost-assumptions">
                            <div class="cost-assumptions-title" data-i18n="form.costAssumptions">Cost assumptions</div>
                            <div class="cost-grid">
                                <div class="form-group">
                                    <label data-i18n="form.consumption">Fuel consumption (L/100 km)</label>
                                    <input type="number" id="rfConsumption" value="7" min="1" max="40" step="0.1">
                                </div>
                                <div class="form-group">
                                    <label data-i18n="form.fuelPrice">Fuel price (EUR/L)</label>
                                    <input type="number" id="rfFuelPrice" value="1.50" min="0.1" max="10" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label data-i18n="form.lodgingPerNight">Lodging per night (EUR)</label>
                                    <input type="number" id="rfLodging" value="60" min="0" step="5">
                                </div>
                                <div class="form-group">
                                    <label data-i18n="form.mealsPerDay">Meals per day (EUR)</label>
                                    <input type="number" id="rfMeals" value="35" min="0" step="5">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
                        <button class="btn btn-primary btn-lg btn-full" id="generateBtn" data-i18n="form.generate">Generate Route with AI</button>
                        <button class="btn btn-outline btn-full" id="clearBtn" data-i18n="form.clear">Clear</button>
                    </div>
                    <div class="form-msg" id="formMsg"></div>
                </div>
            </div>

            <!-- RIGHT: Result -->
            <div>
                <div class="card">
                    <div class="card-header" style="justify-content:space-between">
                        <span>&#x1F4CB; <span data-i18n="result.title">Result</span></span>
                        <button class="btn btn-primary btn-sm" id="saveRouteBtn" style="display:none" data-i18n="result.saveRoute">Save Route</button>
                    </div>

                    <!-- Empty State -->
                    <div id="resultEmpty" class="result-empty">
                        <div class="result-empty-icon">&#x1F6E3;&#xFE0F;</div>
                        <p data-i18n="result.emptyState">Fill out the form and generate your route to see results here</p>
                    </div>

                    <!-- Loading State (real progress: geocode -> matrix -> plan) -->
                    <div id="resultLoading" class="result-loading" style="display:none">
                        <div class="loading-spinner"></div>
                        <p id="progressStep" class="progress-step"></p>
                        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
                        <p id="progressDetail" class="progress-detail mono"></p>
                        <p id="progressNote" class="progress-note"></p>
                    </div>

                    <!-- Result Content -->
                    <div id="resultContent" style="display:none">
                        <div class="result-header" id="resultHeader"></div>
                        <div class="enrich-status" id="enrichStatus" style="display:none"></div>

                        <!-- Map (quality bar B8). The provenance line is part of the
                             panel, not a decoration: a dashed line is an estimate. -->
                        <div class="map-panel" id="routeMapPanel" style="display:none">
                            <div class="map-panel-head">
                                <span class="map-panel-title" id="routeMapTitle" data-i18n="map.title">Route map</span>
                                <span class="map-source mono" id="routeMapSource"></span>
                            </div>
                            <div class="map-figure" id="routeMapFigure"></div>
                            <div class="map-legend" id="routeMapLegend"></div>
                        </div>

                        <!-- Export (quality bar B8). Everything is built in the browser
                             and downloaded from a Blob — nothing is uploaded. -->
                        <div class="export-bar" id="exportBar" style="display:none">
                            <div class="export-title" data-i18n="exp.title">Export</div>
                            <div class="export-actions">
                                <button class="btn btn-outline btn-sm" id="exportGpxBtn" data-i18n="exp.gpx">GPX</button>
                                <button class="btn btn-outline btn-sm" id="exportPrintBtn" data-i18n="exp.print">Print / PDF</button>
                                <label class="export-date" for="exportStartDate"><span data-i18n="exp.startDate">Trip start date</span>
                                    <input type="date" id="exportStartDate">
                                </label>
                                <button class="btn btn-outline btn-sm" id="exportIcsBtn" data-i18n="exp.ics">Calendar</button>
                            </div>
                            <div class="export-hint" id="exportHint"></div>
                        </div>

                        <div id="resultItinerary"></div>
                        <div class="result-body" id="resultBody" style="display:none"></div>
                    </div>

                    <!-- Error -->
                    <div class="result-error" id="resultError"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="app-footer" data-i18n="footer.tagline">Your intelligent travel companion</div>
</div>

<!-- ═══════════════════════════════════════
     SAVED ROUTES VIEW
     ═══════════════════════════════════════ -->
<div id="savedRoutesView" style="display:none">
    <div class="app-header">
        <div class="app-header-left">
            <span class="app-header-logo">&#x1F5FA;&#xFE0F;</span>
            <span class="app-header-title">Travio</span>
        </div>
        <div class="app-header-right">
            <button class="btn btn-ghost-white btn-sm" onclick="backToHome()" data-i18n="routes.back">Back</button>
        </div>
    </div>
    <div class="main-content">
        <div class="card" style="max-width:700px;margin:0 auto">
            <div class="card-header">&#x1F4BE; <span data-i18n="routes.title">My Saved Routes</span></div>
            <div id="savedRoutesList"></div>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════
     ADMIN VIEW
     ═══════════════════════════════════════ -->
<div id="adminView" style="display:none">
    <div class="app-header">
        <div class="app-header-left">
            <span class="app-header-logo">&#x1F5FA;&#xFE0F;</span>
            <span class="app-header-title">Travio</span>
            <span style="opacity:.7;font-size:13px" data-i18n="admin.title">Admin</span>
        </div>
        <div class="app-header-right">
            <button class="btn btn-ghost-white btn-sm" onclick="adminBack()" data-i18n="admin.back">Back</button>
        </div>
    </div>
    <div class="main-content">
        <div class="card">
            <div class="card-header" style="justify-content:space-between">
                <span>&#x1F465; <span data-i18n="admin.users">Users</span></span>
                <button class="btn btn-primary btn-sm" onclick="showCreateUserForm()" data-i18n="admin.createUser">Create User</button>
            </div>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th data-i18n="admin.name">Name</th>

                        <th data-i18n="admin.language">Language</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="adminUsersBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-overlay" id="userFormModal">
    <div class="modal-box">
        <div class="modal-title" id="userFormTitle" data-i18n="admin.createUser">Create User</div>
        <div class="form-group">
            <label data-i18n="admin.name">Name</label>
            <input type="text" id="ufName">
        </div>
        <div class="form-group">
            <label data-i18n="admin.email">Email</label>
            <input type="email" id="ufEmail">
        </div>
        <div class="form-group">
            <label data-i18n="admin.password">Password</label>
            <input type="password" id="ufPassword">
        </div>
        <div class="form-group">
            <label data-i18n="admin.role">Role</label>
            <select id="ufRole">
                <option value="user" data-i18n="admin.roleUser">User</option>
                <option value="admin" data-i18n="admin.roleAdmin">Administrator</option>
            </select>
        </div>
        <div class="form-group">
            <label data-i18n="admin.language">Language</label>
            <select id="ufLanguage">
                <option value="es">Espanol</option>
                <option value="en">English</option>
                <option value="ca">Catala</option>
                <option value="fr">Francais</option>
                <option value="zh">中文</option>
            </select>
        </div>
        <div class="form-msg" id="userFormMsg"></div>
        <div style="display:flex;gap:8px;margin-top:16px">
            <button class="btn btn-primary" onclick="saveUserForm()" data-i18n="admin.save">Save</button>
            <button class="btn btn-outline" onclick="hideUserForm()" data-i18n="admin.cancel">Cancel</button>
        </div>
    </div>
</div>

<script>
/* ── PWA Service Worker ── */
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(e => console.log('SW:', e));
}
/* ── Set language selectors to current lang ── */
document.addEventListener('DOMContentLoaded', () => {
    const sl = document.getElementById('langSelect');
    const sll = document.getElementById('langSelectLogin');
    if (sl) sl.value = currentLang;
    if (sll) sll.value = currentLang;
    applyTranslations();
});
</script>
